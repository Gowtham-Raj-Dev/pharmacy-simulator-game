<!doctype html><html><body style="margin:0;background:#ddd"><canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/examples/jsm/environments/RoomEnvironment.js';
const q = new URLSearchParams(location.search);
const names = (q.get('n') || 'doctor,intern,staff,visitorM1,visitorM2,visitorM3,meena,nurse,receptionist,visitorF1,visitorF2,visitorF3').split(',');
const clip = q.get('a') || 'idle', t = +(q.get('t') || 1.2), back = q.get('back');
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
r.setSize(innerWidth, innerHeight); r.toneMapping = THREE.NeutralToneMapping; r.outputColorSpace = THREE.SRGBColorSpace;
const s = new THREE.Scene(); s.background = new THREE.Color(0xd8dcdc);
const pm = new THREE.PMREMGenerator(r); s.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture; s.environmentIntensity = 0.6;
s.add(new THREE.HemisphereLight(0xffffff, 0x887766, 0.5)); const d = new THREE.DirectionalLight(0xffffff, 1.6); d.position.set(2, 4, 5); s.add(d);
const cols = Math.min(names.length, +(q.get('cols') || 6)), rows = Math.ceil(names.length / cols);
const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 100);
const L = new GLTFLoader(); const info = [];
await Promise.all(names.map(async (n, i) => {
  const g = await L.loadAsync((q.get('dir') || '/people/') + n + '.glb');
  const o = g.scene; o.position.set((i % cols - (cols - 1) / 2) * 0.75, -Math.floor(i / cols) * 2.0, 0); if (back) o.rotation.y = Math.PI; s.add(o);
  const a = g.animations.find((x) => x.name === clip) || g.animations[0]; if (a) { const mx = new THREE.AnimationMixer(o); mx.clipAction(a).play(); mx.update(t); }
  o.updateMatrixWorld(true); const bb = new THREE.Box3().setFromObject(o);
  const bones = {}; o.traverse((b) => { if (b.isBone && /Pelvis|Head$|L Foot|R Hand|L UpperArm/.test(b.name)) bones[b.name] = b.getWorldPosition(new THREE.Vector3()).toArray().map((v) => +v.toFixed(3)); });
  const mats = []; o.traverse((m) => { if (m.isMesh) [].concat(m.material).forEach((mm) => mats.push(mm.name + ':' + mm.transparent + ':' + mm.alphaTest + ':' + (mm.map?.image?.width))); });
  info.push({ n, h: +(bb.max.y - bb.min.y).toFixed(3), min: bb.min.toArray().map((v) => +v.toFixed(2)), bones, mats, anims: g.animations.map((x) => x.name + ':' + x.duration.toFixed(1)) });
}));
const cy = 0.9 - (rows - 1) * 1.0; cam.position.set(0, cy, 1.25 * Math.max(cols * 0.75 / (2 * Math.tan(15 * Math.PI / 180) * cam.aspect), rows * 2.0 / (2 * Math.tan(15 * Math.PI / 180)))); cam.lookAt(0, cy, 0);
r.render(s, cam); window.__info = info; window.__done = true;
</script></body></html>
