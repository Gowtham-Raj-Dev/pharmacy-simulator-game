<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#dfe6e4;overflow:hidden}</style></head>
<body><script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/examples/jsm/environments/RoomEnvironment.js';
import { Character, randomCustomerDesc, pharmacistDesc, inspectorDesc, RealHumans } from '/src/world/character.js';
if (new URLSearchParams(location.search).get('proc') !== '1') await RealHumans.load();
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); r.setPixelRatio(1);
r.toneMapping = THREE.ACESFilmicToneMapping; document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xdfe6e4);
const pm = new THREE.PMREMGenerator(r); scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
const dl = new THREE.DirectionalLight(0xffffff, 1.2); dl.position.set(2, 4, 3); scene.add(dl);
scene.add(new THREE.HemisphereLight(0xffffff, 0x888877, 0.6));
const floor = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.MeshStandardMaterial({ color: 0xcccccc })); floor.rotation.x = -Math.PI/2; scene.add(floor);
const mode = new URLSearchParams(location.search).get('m') || 'lineup';
const chars = [];
const descs = [pharmacistDesc(), inspectorDesc(),
  randomCustomerDesc({gender:'M', age:34, seed:11}), randomCustomerDesc({gender:'F', age:27, seed:12}),
  randomCustomerDesc({gender:'M', age:72, seed:13}), randomCustomerDesc({gender:'F', age:68, seed:19}),
  randomCustomerDesc({gender:'F', age:7, seed:15}), randomCustomerDesc({gender:'M', age:4, seed:16}), randomCustomerDesc({gender:'F', age:45, seed:21})];
descs.forEach((d, i) => { const c = new Character(d); c.group.position.set((i - 4) * 0.75, 0, 0); scene.add(c.group); chars.push(c); });
const cam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.05, 100);
if (mode === 'face') { const i=+(new URLSearchParams(location.search).get('i')||3); cam.position.set((i-4)*0.75+0.25, chars[i].P.H-0.12, 0.85); cam.lookAt((i-4)*0.75, chars[i].P.H-0.15, 0); chars.forEach(c=>{c.expression='happy';}); }
else if (mode === 'face2') { cam.position.set(-4*0.75+0.0, 1.55, 0.9); cam.lookAt(-4*0.75, 1.5, 0); chars.forEach(c=>{c.expression='concerned';}); }
else if (mode === 'walk') { cam.position.set(4, 1.3, 4); cam.lookAt(0, 0.9, 0); chars.forEach(c=>{ c.speed=1.2; c.targetSpeed=1.2; c.path=[new THREE.Vector3(c.group.position.x,0,30)]; }); }
else if (mode === 'gest') { cam.position.set(0, 1.3, 5.5); cam.lookAt(0, 0.9, 0); const g=['headache','cough','stomach','chest','back','eyes','mouth','ear','throat']; chars.forEach((c,i)=>{c.gesture=g[i]; c.gestureOn=true; c.gestureTimer=99; c.gestureW=1;}); }
else if (mode === 'act') { cam.position.set(0, 1.3, 5.5); cam.lookAt(0, 0.9, 0); const a=['reach','inspect','clipboard','carry','wave','type','take','shrug','pay']; chars.forEach((c,i)=>{c.setAction(a[i], 99);}); chars[8].sit(true); }
else { cam.position.set(0, 1.0, 6.3); cam.lookAt(0, 0.85, 0); }
let last = performance.now();
function tick() { const now = performance.now(); const dt = Math.min(0.05,(now-last)/1000); last = now;
  chars.forEach(c => { if (mode==='walk') { c.update(dt, cam.position); c.group.position.z = 0; } else c.update(dt, cam.position); });
  r.render(scene, cam); requestAnimationFrame(tick); }
for (let i=0;i<60;i++){ chars.forEach(c=>c.update(1/60, cam.position)); }
tick(); window.__ready = true;
</script></body></html>
