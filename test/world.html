<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000;overflow:hidden}</style></head>
<body><script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/examples/jsm/environments/RoomEnvironment.js';
import { buildPharmacy } from '/src/world/pharmacy.js';
import { Character, randomCustomerDesc, pharmacistDesc } from '/src/world/character.js';
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); r.setPixelRatio(1);
r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.0; r.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xdde8ee);
const pm = new THREE.PMREMGenerator(r); scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.7;
const W = buildPharmacy(scene, { quality: 'medium' });
const q = new URLSearchParams(location.search);
const ph = new Character(pharmacistDesc()); ph.group.position.set(-1.2, 0, -4.75); scene.add(ph.group);
const c1 = new Character(randomCustomerDesc({gender:'M', age:34, seed:5, gesture:'headache'})); c1.group.position.set(-1.2,0,-2.85); c1.heading=Math.PI; scene.add(c1.group);
const c2 = new Character(randomCustomerDesc({gender:'F', age:66, seed:8})); c2.group.position.set(-6.35,0,7.62); c2.heading=Math.PI; c2.sit(true); c2.sitW=1; scene.add(c2.group);
const c3 = new Character(randomCustomerDesc({gender:'F', age:29, seed:9})); c3.group.position.set(-1.0,0,1.2); c3.heading=-2.4; scene.add(c3.group);
const cam = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.05, 60);
const views = {
  a: [[0.3, 2.0, 7.5], [-0.5, 1.2, -3]],
  b: [[-0.6, 1.75, -6.9], [-1.2, 1.3, -2.8]],
  c: [[5, 2.4, 3], [-4, 1.0, -2]],
  d: [[-4.5, 1.6, -2.0], [-7.5, 1.0, 1.5]],
  e: [[1.5, 2.2, -3.6], [6.0, 1.0, -7.0]],
  f: [[-1.6, 1.62, -5.6], [-1.2, 1.45, -2.85]],
};
const v = views[q.get('v') || 'a'];
cam.position.set(...v[0]); cam.lookAt(...v[1]);
ph.lookTarget = new THREE.Vector3(-1.2, 1.6, -2.85); c1.lookTarget = new THREE.Vector3(-1.2, 1.6, -4.75); c1.talking = true;
let last = performance.now(), t=0;
for (let i=0;i<90;i++){ [ph,c1,c2,c3].forEach(c=>c.update(1/60, cam.position)); W.update(1/60, i/60, [ph,c1,c2,c3], cam.position); }
function tick(){ const now=performance.now(); const dt=Math.min(0.05,(now-last)/1000); last=now; t+=dt;
  [ph,c1,c2,c3].forEach(c=>c.update(dt, cam.position)); W.update(dt, t, [ph,c1,c2,c3], cam.position);
  r.render(scene, cam); requestAnimationFrame(tick); }
tick();
setTimeout(()=>console.log('drawcalls', r.info.render.calls, 'tris', r.info.render.triangles, 'geos', r.info.memory.geometries, 'tex', r.info.memory.textures), 1500);
</script></body></html>
